# PB4HOST Prospector — single-VPS deployment (API + worker + PostgreSQL + Caddy).
# Usage:  cp ../.env.example ../.env  (edit it)  →  docker compose up -d --build
# Optional self-hosted CRM (Phase 2):  docker compose --profile crm up -d   (then set ESPOCRM_BASE_URL=http://espocrm
# and an API key from EspoCRM → Administration → API Users in .env, and restart web + worker).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prospector
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector -d prospector"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://prospector:${POSTGRES_PASSWORD}@db:5432/prospector
    command: ["prospector", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://prospector:${POSTGRES_PASSWORD}@db:5432/prospector
      SESSION_HTTPS_ONLY: "true"
      ENVIRONMENT: production
    volumes:
      - appdata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://prospector:${POSTGRES_PASSWORD}@db:5432/prospector
      ENVIRONMENT: production
    volumes:
      - appdata:/data
    command: ["prospector", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PROSPECTOR_HOST: ${PROSPECTOR_HOST:-prospector.localhost}
      CRM_HOST: ${CRM_HOST:-crm.localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      - appdata:/data:ro
    entrypoint: ["/bin/sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

  # --- optional: EspoCRM (profile "crm") ---------------------------------------------------------
  espocrm-db:
    image: mariadb:11
    profiles: ["crm"]
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${ESPOCRM_DB_PASSWORD:?set ESPOCRM_DB_PASSWORD in .env}
      MARIADB_DATABASE: espocrm
      MARIADB_USER: espocrm
      MARIADB_PASSWORD: ${ESPOCRM_DB_PASSWORD}
    volumes:
      - espocrm_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  espocrm:
    image: espocrm/espocrm:latest
    profiles: ["crm"]
    restart: unless-stopped
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD:?set ESPOCRM_ADMIN_PASSWORD in .env}
      ESPOCRM_SITE_URL: https://${CRM_HOST:-crm.localhost}
    volumes:
      - espocrm_data:/var/www/html
    depends_on:
      espocrm-db:
        condition: service_healthy
    expose:
      - "80"

  espocrm-daemon:
    image: espocrm/espocrm:latest
    profiles: ["crm"]
    restart: unless-stopped
    volumes:
      - espocrm_data:/var/www/html
    entrypoint: docker-daemon.sh
    depends_on:
      - espocrm

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
  backups:
  espocrm_db:
  espocrm_data:
