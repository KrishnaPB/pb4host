[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pb4host-prospector"
version = "0.1.0"
description = "Organisation-first lead discovery and enrichment for PB4HOST (Phase 1 MVP of the customer intelligence app)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "dnspython>=2.6",
  "phonenumbers>=8.13",
  "email-validator>=2.1",
  "tldextract>=5.1",
  "rapidfuzz>=3.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "protego>=0.3",
  "pyotp>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
prospector = "prospector.cli:app"

[tool.setuptools.packages.find]
include = ["prospector*"]

[tool.setuptools.package-data]
prospector = [
  "api/templates/*.html",
  "api/templates/**/*.html",
  "api/static/*.css",
  "api/static/vendor/*",
  "scoring/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF012", "SIM108", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM", "RUF059"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
